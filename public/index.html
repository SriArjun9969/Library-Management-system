<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ─── Toast Container ──────────────────────────────────────────────────────── -->
<div id="toast-container"></div>

<!-- ─── Auth View ────────────────────────────────────────────────────────────── -->
<div id="auth-view" class="auth-wrapper" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">
      <i class="fas fa-book-open"></i>
      <h1>Library Management</h1>
      <p>Your gateway to knowledge</p>
    </div>

    <!-- Auth Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Login</button>
      <button class="auth-tab" data-tab="register">Register</button>
    </div>

    <!-- Login Form -->
    <div id="login-form">
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-icon">
            <i class="fas fa-envelope"></i>
            <input type="email" id="login-email" class="form-control" placeholder="Enter your email" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
      </form>

      <div style="margin-top:20px;padding:16px;background:#f8fafc;border-radius:8px;font-size:.8rem">
        <p style="font-weight:600;margin-bottom:8px;color:#374151">🔑 Demo Accounts</p>
        <p>Admin: <strong>admin@library.com</strong> / password123</p>
        <p>Librarian: <strong>bob@library.com</strong> / password123</p>
        <p>User: <strong>john@student.com</strong> / password123</p>
      </div>
    </div>

    <!-- Register Form -->
    <div id="register-form" style="display:none">
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <div class="input-icon">
            <i class="fas fa-user"></i>
            <input type="text" id="reg-name" class="form-control" placeholder="Enter your full name" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-icon">
            <i class="fas fa-envelope"></i>
            <input type="email" id="reg-email" class="form-control" placeholder="Enter your email" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <div class="input-icon">
            <i class="fas fa-phone"></i>
            <input type="tel" id="reg-phone" class="form-control" placeholder="Enter your phone number">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-icon">
            <i class="fas fa-lock"></i>
            <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" required minlength="6">
          </div>
          <div class="form-hint">Minimum 6 characters</div>
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </form>
    </div>
  </div>
</div>

<!-- ─── App View (Dashboard) ─────────────────────────────────────────────────── -->
<div id="app-view" class="app-layout" style="display:none">

  <!-- Sidebar Overlay (mobile) -->
  <div id="sidebar-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99" onclick="document.getElementById('sidebar').classList.remove('open');this.style.display='none'"></div>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <i class="fas fa-book-open"></i>
      <span>LibraryMS</span>
    </div>

    <div class="sidebar-nav" id="sidebar-nav">
      <!-- Rendered by JS -->
    </div>

    <div class="sidebar-footer" id="sidebar-user-info">
      <!-- Rendered by JS -->
    </div>
  </nav>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Top Bar -->
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebar-overlay').style.display='block'">
          <i class="fas fa-bars"></i>
        </button>
        <h1 class="topbar-title" id="page-title">Dashboard</h1>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-secondary btn-sm" onclick="navigateTo('books')">
          <i class="fas fa-search"></i> Browse Books
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content" id="page-content">
      <div class="loading-wrap">
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>
    </main>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
